[project]
name = "audity-api"
version = "0.1.0"
description = "Audity audio editor backend — format conversion API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "scipy>=1.14",
    "noisereduce>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audity_api"]
